name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [debug, debug-sanitize]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        # Long randomized tests run a smaller fixed set of seeds here (same
        # checks); scripts/check.sh runs them in full before every commit.
        env:
          TICKFORGE_SHORT_TESTS: "1"
        run: ctest --preset ${{ matrix.preset }}

      - name: Show skipped tests (with reasons) and test settings
        if: always()
        run: |
          log="build/${{ matrix.preset }}/Testing/Temporary/LastTest.log"
          grep -h -A1 ": Skipped$" "$log" || echo "No skipped tests."
          grep -h "\[test setting\]" "$log" || true

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install package and test deps
        working-directory: python
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run tests
        working-directory: python
        # -rs prints the reason for every skipped test (those needing data/).
        run: uv run pytest -rs
